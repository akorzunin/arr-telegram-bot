services:
  arr-telegram-bot:
    build: .
    restart: unless-stopped
    user: "${BOT_UID:-1000}:${BOT_GID:-1000}"
    env_file: ${ARR_BOT_ENV_FILE:-/srv/deploy/arr/bot.env}
    environment:
      RADARR_URL: http://radarr:7878
      SONARR_URL: http://sonarr:8989
      RADARR_ROOT: /downloads/complete/films
      SONARR_ROOT: /downloads/complete/shows
      HTTP_PROXY: http://host.docker.internal:20171
      HTTPS_PROXY: http://host.docker.internal:20171
      NO_PROXY: radarr,sonarr,localhost,127.0.0.1
      no_proxy: radarr,sonarr,localhost,127.0.0.1
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - arr_shared
    volumes:
      - /srv/deploy/arr/config/bot:/state
networks:
  arr_shared:
    external: true
    name: arr_shared
